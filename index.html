<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dinkboard — Pickleball Brackets</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#0f1d2e;
  --ink-soft:#5b7086;
  --court:#2461a8;
  --court-dark:#123a63;
  --kitchen:#dbe6f2;
  --line:#f3f6fb;
  --ball:#d7e94f;
  --ball-dark:#b9cf34;
  --danger:#c1543f;
  --white:#ffffff;
  --radius:18px;
  --radius-sm:12px;
  --shadow: 0 8px 24px rgba(15,29,46,0.12);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--line);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input{font-family:inherit;}

.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--line);
}

/* ---------- Header ---------- */
.header{
  background:var(--ink);
  color:var(--line);
  padding:22px 20px 16px;
  position:sticky;
  top:0;
  z-index:20;
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-family:'Bricolage Grotesque', sans-serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:0.01em;
  display:flex;
  align-items:baseline;
  gap:2px;
}
.logo .ball-dot{
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:var(--ball);
  margin-left:5px;
  transform:translateY(-8px);
}
.header-sub{
  font-size:12px;
  color:#93a8bf;
  margin-top:2px;
  font-weight:500;
  letter-spacing:0.02em;
  text-transform:uppercase;
}
.header-action{
  background:none;
  border:1px solid #26405c;
  color:var(--line);
  font-size:12px;
  font-weight:600;
  padding:7px 12px;
  border-radius:100px;
  cursor:pointer;
  letter-spacing:0.02em;
}
.header-action:active{ background:#1c344f; }

/* net divider: dashed line signature motif */
.net-divider{
  width:100%;
  height:1px;
  margin-top:16px;
  background-image:linear-gradient(to right, #2c4a68 0, #2c4a68 6px, transparent 6px, transparent 12px);
  background-size:12px 1px;
  background-repeat:repeat-x;
}

.tabs{
  display:flex;
  gap:6px;
  margin-top:14px;
}
.tab{
  flex:1;
  text-align:center;
  padding:9px 0;
  font-size:13px;
  font-weight:600;
  border-radius:100px;
  cursor:pointer;
  color:#93a8bf;
  background:transparent;
  border:1px solid #26405c;
  letter-spacing:0.01em;
}
.tab.active{
  background:var(--ball);
  color:var(--ink);
  border-color:var(--ball);
}

/* ---------- Content ---------- */
.content{
  flex:1;
  padding:22px 18px 60px;
}
.section-title{
  font-family:'Bricolage Grotesque', sans-serif;
  font-weight:700;
  font-size:19px;
  margin:0 0 4px;
  letter-spacing:-0.01em;
}
.section-help{
  font-size:13px;
  color:var(--ink-soft);
  margin:0 0 18px;
  line-height:1.5;
}

.card{
  background:var(--white);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

/* ---------- Setup: segmented control ---------- */
.field-label{
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:10px;
  display:block;
}
.segmented{
  display:flex;
  background:var(--kitchen);
  border-radius:100px;
  padding:4px;
  gap:4px;
}
.segmented button{
  flex:1;
  border:none;
  background:transparent;
  padding:11px 8px;
  border-radius:100px;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.segmented button.active{
  background:var(--ink);
  color:var(--ball);
}

/* stepper */
.stepper-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stepper{
  display:flex;
  align-items:center;
  gap:14px;
}
.stepper button{
  width:38px;height:38px;
  border-radius:50%;
  border:1.5px solid var(--court);
  background:var(--white);
  color:var(--court);
  font-size:19px;
  font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.stepper button:active{ background:var(--court); color:var(--white); }
.stepper-value{
  font-family:'IBM Plex Mono', monospace;
  font-size:26px;
  font-weight:600;
  min-width:34px;
  text-align:center;
}
.stepper-note{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:10px;
}
.warning-note{
  font-size:12.5px;
  color:#8a4a1f;
  background:#fbeee0;
  border-radius:var(--radius-sm);
  padding:9px 12px;
  margin-top:10px;
  font-weight:600;
  line-height:1.4;
}

/* player rows */
.player-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--kitchen);
}
.player-row:last-child{border-bottom:none;}
.player-num{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  width:20px;
  flex-shrink:0;
}
.player-row input[type=text]{
  flex:1;
  border:none;
  background:transparent;
  font-size:15px;
  font-weight:500;
  color:var(--ink);
  padding:8px 4px;
  border-bottom:1.5px solid transparent;
}
.player-row input[type=text]:focus{
  outline:none;
  border-bottom:1.5px solid var(--court);
}
.gender-toggle{
  display:flex;
  border-radius:100px;
  overflow:hidden;
  border:1.5px solid var(--kitchen);
  flex-shrink:0;
}
.gender-toggle button{
  border:none;
  background:var(--white);
  width:32px;height:28px;
  font-size:12px;
  font-weight:700;
  color:var(--ink-soft);
  cursor:pointer;
}
.gender-toggle button.active{
  background:var(--court);
  color:var(--white);
}

.primary-btn{
  width:100%;
  background:var(--ball);
  color:var(--ink);
  border:none;
  padding:16px;
  border-radius:100px;
  font-size:15.5px;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
  letter-spacing:0.01em;
}
.primary-btn:active{ background:var(--ball-dark); }
.primary-btn:disabled{
  background:#d7e0ea;
  color:#90a0b0;
  cursor:not-allowed;
}
.secondary-btn{
  width:100%;
  background:transparent;
  color:var(--court);
  border:1.5px solid var(--court);
  padding:13px;
  border-radius:100px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}

/* ---------- Rounds screen ---------- */
.round-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.round-nav-btn{
  width:36px;height:36px;
  border-radius:50%;
  border:1.5px solid var(--court);
  background:var(--white);
  color:var(--court);
  font-size:16px;
  cursor:pointer;
}
.round-nav-btn:disabled{
  opacity:0.3;
  cursor:default;
}
.round-title{
  text-align:center;
  font-family:'Bricolage Grotesque', sans-serif;
  font-weight:700;
  font-size:18px;
}
.round-dashes{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:20px;
}
.round-dashes span{
  width:16px;height:4px;
  border-radius:2px;
  background:var(--kitchen);
}
.round-dashes span.done{ background:var(--court); }
.round-dashes span.current{ background:var(--ball-dark); }

.bye-note{
  font-size:12.5px;
  color:var(--ink-soft);
  background:var(--kitchen);
  padding:10px 14px;
  border-radius:var(--radius-sm);
  margin-bottom:14px;
}

/* court matchup card — signature element */
.court-card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}
.court-card-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  padding:12px 16px 0;
}
.court-card-label .tap-hint{
  font-weight:500;
  text-transform:none;
  letter-spacing:0;
  color:#8ea0b5;
}
.court-body{
  display:flex;
  align-items:stretch;
  padding:14px 10px 0;
}
.team-side{
  flex:1;
  text-align:center;
  padding:10px 8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  border-radius:var(--radius-sm);
  border:1.5px solid transparent;
}
.team-side.selectable{
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease;
}
.team-side.selectable:active{

}
.team-side .p-name{
  font-size:14.5px;
  font-weight:600;
  line-height:1.35;
}
.win-badge{
  display:none;
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--court);
  margin-top:4px;
}
.team-side.winner{
  background:#e7f0fb;
  border-color:var(--court);
}
.team-side.winner .win-badge{
  display:block;
}
.net-col{
  width:1px;
  background-image:linear-gradient(to bottom, var(--court) 0, var(--court) 6px, transparent 6px, transparent 12px);
  background-size:1px 12px;
  background-repeat:repeat-y;
  flex-shrink:0;
}
.kitchen-band{
  background:var(--kitchen);
  margin:14px 10px 14px;
  border-radius:var(--radius-sm);
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.score-input{
  width:56px;
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:20px;
  font-weight:600;
  border:1.5px solid #c3d4e6;
  border-radius:10px;
  padding:8px 4px;
  background:var(--white);
  color:var(--ink);
}
.score-input:focus{
  outline:none;
  border-color:var(--court);
}
.score-dash{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  color:var(--ink-soft);
}

/* ---------- Standings ---------- */
.standings-table{
  width:100%;
  border-collapse:collapse;
}
.standings-table th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  padding:0 8px 10px;
  font-weight:700;
}
.standings-table th.center, .standings-table td.center{ text-align:center; }
.standings-table td{
  padding:12px 8px;
  border-top:1px solid var(--kitchen);
  font-size:14.5px;
  font-weight:500;
}
.rank-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--kitchen);
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  font-weight:700;
  margin-right:8px;
}
.rank-badge.top{
  background:var(--ball);
  color:var(--ink);
}
.record-cell{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
}
.empty-note{
  font-size:13px;
  color:var(--ink-soft);
  text-align:center;
  padding:30px 10px;
}
</style>

<body>
<div class="app" id="app"></div>

<script>
/* ============ STATE ============ */
const state = {
  screen: 'setup',       // 'setup' | 'rounds' | 'standings'
  matchType: 'gender',   // 'gender' | 'mixed'
  numPlayers: 8,
  numRounds: 4,
  gamesTo: 11,           // points to win a game (11 or 15)
  players: [],           // {id, name, gender}
  rounds: [],            // [{matchups:[{teamA:[ids], teamB:[ids], scoreA, scoreB}], sitOut:[ids]}]
  currentRound: 0
};

function initPlayers(){
  const arr = [];
  for(let i=0;i<state.numPlayers;i++){
    const existing = state.players[i];
    arr.push(existing || { id:'p'+i, name:'', gender: i%2===0?'M':'F' });
  }
  state.players = arr;
}
initPlayers();
// default rounds to the max achievable with every partner/pairing unique
state.numRounds = Math.max(1, currentMaxRounds());

/* ============ PAIRING ALGORITHMS ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function oppKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }

function makePairCounts(players){
  const o = {};
  players.forEach(a=> players.forEach(b=>{ if(a.id!==b.id) o[oppKey(a.id,b.id)]=0; }));
  return o;
}

/* Best-effort pairing for rounds beyond the strict-uniqueness cap: greedily
   pairs players, always preferring the partner they've been paired with
   least so far. Can't guarantee no repeats once every unique pairing is
   used up, but spreads repeats out as evenly as possible. */
function greedyPairPlayers(pool, partnerCount){
  const remaining = shuffle(pool);
  const teams = [];
  while(remaining.length >= 2){
    const a = remaining.shift();
    let bestIdx = 0, bestScore = Infinity;
    for(let j=0;j<remaining.length;j++){
      const score = partnerCount[oppKey(a.id, remaining[j].id)] || 0;
      if(score < bestScore){ bestScore = score; bestIdx = j; }
    }
    const b = remaining.splice(bestIdx,1)[0];
    teams.push([a,b]);
    partnerCount[oppKey(a.id,b.id)] = (partnerCount[oppKey(a.id,b.id)]||0) + 1;
  }
  return teams;
}

/* Given a flat list of teams (each an array of 2 players) for a single round,
   bench a team if the count is odd (fairly, favoring those who've sat out
   least so far), then greedily pair remaining teams into courts, minimizing
   how often the same two players have already faced each other. */
function assignCourtsForRound(teams, byeCount, opponentCount, conflictScore){
  teams = shuffle(teams);
  const sitOutIds = [];
  const scoreOf = conflictScore || ((teamA, teamB)=>{
    let score = 0;
    teamA.forEach(pa=> teamB.forEach(pb=> score += opponentCount[oppKey(pa.id,pb.id)]));
    return score;
  });

  if(teams.length % 2 === 1){
    teams.sort((t1,t2)=>
      (byeCount[t1[0].id]+byeCount[t1[1].id]) - (byeCount[t2[0].id]+byeCount[t2[1].id])
    );
    const benched = teams.shift();
    benched.forEach(p=>{ sitOutIds.push(p.id); byeCount[p.id]++; });
  }

  const matchups = [];
  const remaining = teams.slice();
  while(remaining.length >= 2){
    const teamA = remaining.shift();
    let bestIdx = 0, bestScore = Infinity;
    for(let j=0;j<remaining.length;j++){
      const score = scoreOf(teamA, remaining[j]);
      if(score < bestScore){ bestScore = score; bestIdx = j; }
    }
    const teamB = remaining.splice(bestIdx,1)[0];
    matchups.push({ teamA: teamA.map(p=>p.id), teamB: teamB.map(p=>p.id), scoreA:'', scoreB:'' });
    teamA.forEach(pa=> teamB.forEach(pb=> opponentCount[oppKey(pa.id,pb.id)]++));
  }
  return { matchups, sitOutIds };
}

/* Gender doubles: every player partners every other player at most once
   (strict), using the standard round-robin "circle method" — a 1-factorization
   of the complete graph over players. If the player count is odd, a phantom
   "bye" slot is added; whoever draws it sits out that round. Any rounds
   requested beyond the strict-uniqueness cap are filled in afterward using
   best-effort greedy pairing, so repeats are spread out as evenly as possible
   rather than guaranteed unique. */
function buildGenderRounds(players, numRounds){
  let list = shuffle(players);
  const hasPhantom = list.length % 2 === 1;
  if(hasPhantom) list = [...list, { id:'__BYE__', phantom:true }];
  const M = list.length;
  const cap = M - 1;
  const uniqueRounds = Math.min(numRounds, cap);

  const byeCount = {};
  players.forEach(p=> byeCount[p.id]=0);
  const opponentCount = makePairCounts(players);
  const partnerCount = makePairCounts(players);

  let arr = list.slice();
  const rounds = [];
  for(let r=0;r<uniqueRounds;r++){
    const pairs = [];
    for(let i=0;i<M/2;i++) pairs.push([arr[i], arr[M-1-i]]);

    const sitOutIds = [];
    const teams = [];
    pairs.forEach(([a,b])=>{
      if(a.phantom){ sitOutIds.push(b.id); byeCount[b.id]++; }
      else if(b.phantom){ sitOutIds.push(a.id); byeCount[a.id]++; }
      else { teams.push([a,b]); partnerCount[oppKey(a.id,b.id)] = 1; }
    });

    const { matchups, sitOutIds: courtSitOuts } = assignCourtsForRound(teams, byeCount, opponentCount);
    rounds.push({ matchups, sitOut: [...sitOutIds, ...courtSitOuts] });

    // rotate: keep slot 0 fixed, rotate the rest by one
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }

  for(let r=uniqueRounds; r<numRounds; r++){
    let pool = players.slice();
    const sitOutIds = [];
    if(pool.length % 2 === 1){
      pool = shuffle(pool).sort((a,b)=> byeCount[a.id]-byeCount[b.id]);
      const bench = pool.shift();
      sitOutIds.push(bench.id);
      byeCount[bench.id]++;
    }
    const teams = greedyPairPlayers(pool, partnerCount);
    const { matchups, sitOutIds: courtSitOuts } = assignCourtsForRound(teams, byeCount, opponentCount);
    rounds.push({ matchups, sitOut: [...sitOutIds, ...courtSitOuts] });
  }

  return rounds;
}

/* Mixed doubles: every team is one male + one female, and no male/female
   pairing repeats. Implemented as a cyclic Latin-rectangle rotation between
   the two gender groups — the smaller group cycles through every member of
   the larger group exactly once over max(M,F) rounds; extra members of the
   larger group rotate through as sit-outs. Rounds requested beyond that cap
   fall back to best-effort greedy male/female pairing. */
function buildMixedRounds(players, numRounds){
  const males = shuffle(players.filter(p=>p.gender==='M'));
  const females = shuffle(players.filter(p=>p.gender==='F'));
  if(males.length < 2 || females.length < 2) return [];

  const smaller = males.length <= females.length ? males : females;
  const larger = males.length <= females.length ? females : males;
  const S = smaller.length, L = larger.length;
  const cap = L;
  const uniqueRounds = Math.min(numRounds, cap);

  const byeCount = {};
  players.forEach(p=> byeCount[p.id]=0);
  const opponentCount = makePairCounts(players);
  const partnerCount = makePairCounts(players);
  const genderOf = {};
  players.forEach(p=> genderOf[p.id] = p.gender);
  // Male/female pairs already get diversified as partners, so what actually
  // needs spreading out across courts is same-gender opposition.
  const sameGenderConflict = (teamA, teamB) => {
    let score = 0;
    teamA.forEach(pa=> teamB.forEach(pb=>{
      if(genderOf[pa.id]===genderOf[pb.id]) score += opponentCount[oppKey(pa.id,pb.id)];
    }));
    return score;
  };

  const rounds = [];
  for(let r=0;r<uniqueRounds;r++){
    const teams = [];
    const usedLargerIdx = new Set();
    for(let i=0;i<S;i++){
      const largerIdx = (i+r) % L;
      teams.push([smaller[i], larger[largerIdx]]);
      partnerCount[oppKey(smaller[i].id, larger[largerIdx].id)] = 1;
      usedLargerIdx.add(largerIdx);
    }
    const sitOutIds = [];
    larger.forEach((p,idx)=>{ if(!usedLargerIdx.has(idx)){ sitOutIds.push(p.id); byeCount[p.id]++; } });

    const { matchups, sitOutIds: courtSitOuts } = assignCourtsForRound(teams, byeCount, opponentCount, sameGenderConflict);
    rounds.push({ matchups, sitOut: [...sitOutIds, ...courtSitOuts] });
  }

  for(let r=uniqueRounds; r<numRounds; r++){
    let malePool = males.slice(), femalePool = females.slice();
    const sitOutIds = [];
    const diff = malePool.length - femalePool.length;
    if(diff > 0){
      malePool = shuffle(malePool).sort((a,b)=> byeCount[a.id]-byeCount[b.id]);
      sitOutIds.push(...malePool.slice(0,diff).map(p=>{ byeCount[p.id]++; return p.id; }));
      malePool = malePool.slice(diff);
    } else if(diff < 0){
      femalePool = shuffle(femalePool).sort((a,b)=> byeCount[a.id]-byeCount[b.id]);
      sitOutIds.push(...femalePool.slice(0,-diff).map(p=>{ byeCount[p.id]++; return p.id; }));
      femalePool = femalePool.slice(-diff);
    }
    malePool = shuffle(malePool);
    const remainingF = shuffle(femalePool);
    const teams = [];
    malePool.forEach(m=>{
      let bestIdx = 0, bestScore = Infinity;
      for(let j=0;j<remainingF.length;j++){
        const score = partnerCount[oppKey(m.id, remainingF[j].id)] || 0;
        if(score < bestScore){ bestScore = score; bestIdx = j; }
      }
      const f = remainingF.splice(bestIdx,1)[0];
      teams.push([m,f]);
      partnerCount[oppKey(m.id,f.id)] = (partnerCount[oppKey(m.id,f.id)]||0) + 1;
    });

    const { matchups, sitOutIds: courtSitOuts } = assignCourtsForRound(teams, byeCount, opponentCount, sameGenderConflict);
    rounds.push({ matchups, sitOut: [...sitOutIds, ...courtSitOuts] });
  }

  return rounds;
}

/* Max rounds achievable while keeping the strict uniqueness rule for each format. */
function maxRoundsGender(players){
  const N = players.length;
  if(N < 4) return 0;
  return N % 2 === 0 ? N - 1 : N;
}
function maxRoundsMixed(players){
  const M = players.filter(p=>p.gender==='M').length;
  const F = players.filter(p=>p.gender==='F').length;
  if(M < 2 || F < 2) return 0;
  return Math.max(M, F);
}
function currentMaxRounds(){
  return state.matchType === 'gender' ? maxRoundsGender(state.players) : maxRoundsMixed(state.players);
}
function resetRoundsToDefault(){
  state.numRounds = Math.max(1, currentMaxRounds());
}

/* Scores a generated schedule by how well it spreads out OPPONENT match-ups
   (not just partners). A single random pass through the greedy builders can
   land on a locally-good-looking split each round that nonetheless never
   surfaces certain pairs across the whole schedule (e.g. two players who
   simply never end up on opposite teams). Fewer never-played pairs is best;
   a lower peak repeat count is the tiebreaker. Used for gender doubles, where
   every pair of players is an equally relevant opponent relationship. */
function scoreOpponentDiversity(rounds, players){
  const count = {};
  players.forEach(a=> players.forEach(b=>{ if(a.id!==b.id) count[oppKey(a.id,b.id)]=0; }));
  rounds.forEach(r=> r.matchups.forEach(m=>{
    m.teamA.forEach(pa=> m.teamB.forEach(pb=> count[oppKey(pa,pb)]++));
  }));
  const vals = Object.values(count);
  const neverOpposed = vals.filter(v=>v===0).length;
  const maxRepeat = vals.length ? Math.max(...vals) : 0;
  return { neverOpposed, maxRepeat };
}

/* For mixed doubles, male/female pairs already get diversified as PARTNERS,
   so the opponent relationship that actually needs spreading out is same-
   gender: every male should ideally face every other male, and every female
   every other female, across the schedule. Cross-gender opponent overlap
   isn't scored here since that's already handled by the partner rotation. */
function scoreMixedOpponentDiversity(rounds, players){
  const genderOf = {};
  players.forEach(p=> genderOf[p.id] = p.gender);
  const sameCount = {};
  players.forEach(a=> players.forEach(b=>{
    if(a.id!==b.id && a.gender===b.gender) sameCount[oppKey(a.id,b.id)] = 0;
  }));
  rounds.forEach(r=> r.matchups.forEach(m=>{
    m.teamA.forEach(pa=> m.teamB.forEach(pb=>{
      if(genderOf[pa]===genderOf[pb]) sameCount[oppKey(pa,pb)]++;
    }));
  }));
  const vals = Object.values(sameCount);
  const neverOpposed = vals.filter(v=>v===0).length;
  const maxRepeat = vals.length ? Math.max(...vals) : 0;
  return { neverOpposed, maxRepeat };
}

function isBetterSchedule(a, b){
  if(a.neverOpposed !== b.neverOpposed) return a.neverOpposed < b.neverOpposed;
  return a.maxRepeat < b.maxRepeat;
}

function buildRounds(){
  const ATTEMPTS = 300;
  let best = null, bestScore = null;
  for(let i=0;i<ATTEMPTS;i++){
    const rounds = state.matchType === 'gender'
      ? buildGenderRounds(state.players, state.numRounds)
      : buildMixedRounds(state.players, state.numRounds);
    const score = state.matchType === 'gender'
      ? scoreOpponentDiversity(rounds, state.players)
      : scoreMixedOpponentDiversity(rounds, state.players);
    if(!best || isBetterSchedule(score, bestScore)){
      best = rounds;
      bestScore = score;
    }
  }
  state.rounds = best;
}

function playerName(id){
  const p = state.players.find(p=>p.id===id);
  return p ? (p.name || '(unnamed)') : '?';
}

/* ============ STANDINGS ============ */
function computeStandings(){
  const record = {};
  state.players.forEach(p=> record[p.id] = { name: p.name || '(unnamed)', w:0, l:0 });

  state.rounds.forEach(round=>{
    round.matchups.forEach(m=>{
      const sa = parseInt(m.scoreA, 10);
      const sb = parseInt(m.scoreB, 10);
      if(isNaN(sa) || isNaN(sb) || sa===sb) return;
      const aWon = sa > sb;
      m.teamA.forEach(id=>{ record[id][aWon?'w':'l']++; });
      m.teamB.forEach(id=>{ record[id][aWon?'l':'w']++; });
    });
  });

  return Object.values(record).sort((a,b)=> b.w-a.w || a.l-b.l);
}

/* ============ RENDER ============ */
const app = document.getElementById('app');

function render(){
  if(state.screen === 'setup') renderSetup();
  else if(state.screen === 'rounds') renderRounds();
  else renderStandings();
}

function headerHTML(showTabs){
  return `
    <div class="header">
      <div class="header-row">
        <div>
          <div class="logo">DINKBOARD<span class="ball-dot"></span></div>
          <div class="header-sub">pickleball round manager</div>
        </div>
        ${state.screen!=='setup' ? `<button class="header-action" id="btn-edit-setup">Edit setup</button>` : ''}
      </div>
      <div class="net-divider"></div>
      ${showTabs ? `
      <div class="tabs">
        <div class="tab ${state.screen==='rounds'?'active':''}" id="tab-rounds">Rounds</div>
        <div class="tab ${state.screen==='standings'?'active':''}" id="tab-standings">Standings</div>
      </div>` : ''}
    </div>
  `;
}

function renderSetup(){
  const cap = currentMaxRounds();
  const namesFilled = !state.players.some(p=>!p.name.trim());
  const canBuild = namesFilled && cap > 0;
  const overCap = cap > 0 && state.numRounds > cap;

  const roundsNote = cap > 0
    ? (state.matchType === 'gender'
        ? `Max rounds with every partner unique: ${cap}.`
        : `Max rounds with every male/female pairing unique: ${cap}.`)
    : `Need at least 2 male and 2 female players to build a mixed doubles bracket — adjust the M/F tags below.`;

  app.innerHTML = `
    ${headerHTML(false)}
    <div class="content">
      <h2 class="section-title">Set up your bracket</h2>
      <p class="section-help">Pick a match format, add your players, and choose how many rounds you're playing.</p>

      <div class="card">
        <span class="field-label">Match format</span>
        <div class="segmented">
          <button data-type="gender" class="${state.matchType==='gender'?'active':''}">Gender Doubles</button>
          <button data-type="mixed" class="${state.matchType==='mixed'?'active':''}">Mixed Doubles</button>
        </div>
      </div>

      <div class="card">
        <span class="field-label">Number of players</span>
        <div class="stepper-row">
          <div class="stepper">
            <button id="players-minus">−</button>
            <div class="stepper-value">${state.numPlayers}</div>
            <button id="players-plus">+</button>
          </div>
        </div>
        <div class="stepper-note">Byes rotate fairly if the numbers don't divide evenly.</div>
      </div>

      <div class="card">
        <span class="field-label">Number of rounds</span>
        <div class="stepper-row">
          <div class="stepper">
            <button id="rounds-minus">−</button>
            <div class="stepper-value">${state.numRounds}</div>
            <button id="rounds-plus" ${state.numRounds>=30 ? 'disabled' : ''}>+</button>
          </div>
        </div>
        <div class="stepper-note">${roundsNote}</div>
        ${overCap ? `<div class="warning-note">⚠ ${state.numRounds} rounds can't all guarantee unique ${state.matchType==='gender'?'partners':'pairings'} — the extra ${state.numRounds-cap} round${state.numRounds-cap>1?'s':''} will reuse pairings, spread out as evenly as possible.</div>` : ''}
      </div>

      <div class="card">
        <span class="field-label">Games to</span>
        <div class="segmented">
          <button data-games="11" class="${state.gamesTo===11?'active':''}">11</button>
          <button data-games="15" class="${state.gamesTo===15?'active':''}">15</button>
        </div>
        <div class="stepper-note">Tapping a matchup's winner during a round fills in this score automatically.</div>
      </div>

      <div class="card">
        <span class="field-label">Players ${state.matchType==='mixed' ? '(tap M/F for pairing)' : ''}</span>
        <div id="player-list">
          ${state.players.map((p,i)=>`
            <div class="player-row">
              <span class="player-num">${i+1}</span>
              <input type="text" data-idx="${i}" placeholder="Player name" value="${escapeAttr(p.name)}">
              ${state.matchType==='mixed' ? `
              <div class="gender-toggle" data-idx="${i}">
                <button data-g="M" class="${p.gender==='M'?'active':''}">M</button>
                <button data-g="F" class="${p.gender==='F'?'active':''}">F</button>
              </div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>

      <button class="primary-btn" id="btn-build" ${canBuild?'':'disabled'}>Build bracket</button>
    </div>
  `;

  document.querySelectorAll('.segmented button[data-type]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.matchType = b.dataset.type; resetRoundsToDefault(); render(); });
  });
  document.querySelectorAll('.segmented button[data-games]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.gamesTo = parseInt(b.dataset.games, 10); render(); });
  });
  document.getElementById('players-minus').addEventListener('click', ()=>{
    if(state.numPlayers>4){ state.numPlayers-=1; initPlayers(); resetRoundsToDefault(); render(); }
  });
  document.getElementById('players-plus').addEventListener('click', ()=>{
    if(state.numPlayers<40){ state.numPlayers+=1; initPlayers(); resetRoundsToDefault(); render(); }
  });
  document.getElementById('rounds-minus').addEventListener('click', ()=>{
    if(state.numRounds>1){ state.numRounds-=1; render(); }
  });
  document.getElementById('rounds-plus').addEventListener('click', ()=>{
    if(state.numRounds<30){ state.numRounds+=1; render(); }
  });
  document.querySelectorAll('#player-list input[type=text]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      state.players[inp.dataset.idx].name = inp.value;
      const btn = document.getElementById('btn-build');
      btn.disabled = state.players.some(p=>!p.name.trim()) || currentMaxRounds()===0;
    });
  });
  document.querySelectorAll('.gender-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = b.parentElement.dataset.idx;
      state.players[idx].gender = b.dataset.g;
      resetRoundsToDefault();
      render();
    });
  });
  document.getElementById('btn-build').addEventListener('click', ()=>{
    buildRounds();
    state.currentRound = 0;
    state.screen = 'rounds';
    render();
  });
}

function renderRounds(){
  const round = state.rounds[state.currentRound];
  app.innerHTML = `
    ${headerHTML(true)}
    <div class="content">
      <div class="round-nav">
        <button class="round-nav-btn" id="round-prev" ${state.currentRound===0?'disabled':''}>‹</button>
        <div class="round-title">Round ${state.currentRound+1} of ${state.numRounds}</div>
        <button class="round-nav-btn" id="round-next" ${state.currentRound===state.numRounds-1?'disabled':''}>›</button>
      </div>
      <div class="round-dashes">
        ${state.rounds.map((_,i)=>`<span class="${i<state.currentRound?'done':i===state.currentRound?'current':''}"></span>`).join('')}
      </div>

      ${round.sitOut.length ? `<div class="bye-note">Sitting out this round: ${round.sitOut.map(playerName).join(', ')}</div>` : ''}

      ${round.matchups.map((m,mi)=>`
        <div class="court-card">
          <div class="court-card-label">Court ${mi+1} <span class="tap-hint">— tap the winner</span></div>
          <div class="court-body">
            <div class="team-side selectable ${String(m.scoreA)===String(state.gamesTo)?'winner':''}" data-round="${state.currentRound}" data-match="${mi}" data-team="A">
              ${m.teamA.map(id=>`<div class="p-name">${escapeHTML(playerName(id))}</div>`).join('')}
              <div class="win-badge">Winner</div>
            </div>
            <div class="net-col"></div>
            <div class="team-side selectable ${String(m.scoreB)===String(state.gamesTo)?'winner':''}" data-round="${state.currentRound}" data-match="${mi}" data-team="B">
              ${m.teamB.map(id=>`<div class="p-name">${escapeHTML(playerName(id))}</div>`).join('')}
              <div class="win-badge">Winner</div>
            </div>
          </div>
          <div class="kitchen-band">
            <input type="number" min="0" max="${state.gamesTo}" class="score-input" data-round="${state.currentRound}" data-match="${mi}" data-team="A" value="${m.scoreA}" placeholder="0">
            <span class="score-dash">–</span>
            <input type="number" min="0" max="${state.gamesTo}" class="score-input" data-round="${state.currentRound}" data-match="${mi}" data-team="B" value="${m.scoreB}" placeholder="0">
          </div>
        </div>
      `).join('')}

      ${state.currentRound === state.numRounds-1 ? `<button class="primary-btn" id="btn-see-standings">See final standings</button>` : ''}
    </div>
  `;

  document.getElementById('round-prev')?.addEventListener('click', ()=>{ state.currentRound--; render(); });
  document.getElementById('round-next')?.addEventListener('click', ()=>{ state.currentRound++; render(); });
  document.getElementById('tab-rounds')?.addEventListener('click', ()=>{ state.screen='rounds'; render(); });
  document.getElementById('tab-standings')?.addEventListener('click', ()=>{ state.screen='standings'; render(); });
  document.getElementById('btn-edit-setup')?.addEventListener('click', backToSetup);
  document.getElementById('btn-see-standings')?.addEventListener('click', ()=>{ state.screen='standings'; render(); });

  document.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = inp.dataset.round, mi = inp.dataset.match, team = inp.dataset.team;
      state.rounds[r].matchups[mi]['score'+team] = inp.value;
    });
  });

  document.querySelectorAll('.team-side.selectable').forEach(el=>{
    el.addEventListener('click', ()=>{
      const r = el.dataset.round, mi = el.dataset.match, team = el.dataset.team;
      const other = team === 'A' ? 'B' : 'A';
      const m = state.rounds[r].matchups[mi];
      const isAlreadyWinner = String(m['score'+team]) === String(state.gamesTo);
      if(isAlreadyWinner){
        m['score'+team] = '';
      } else {
        m['score'+team] = String(state.gamesTo);
        if(String(m['score'+other]) === String(state.gamesTo)) m['score'+other] = '';
      }
      render();
    });
  });
}

function renderStandings(){
  const standings = computeStandings();
  const anyScores = state.rounds.some(r=>r.matchups.some(m=>m.scoreA!=='' && m.scoreB!==''));
  app.innerHTML = `
    ${headerHTML(true)}
    <div class="content">
      <h2 class="section-title">Standings</h2>
      <p class="section-help">Win-loss record across all entered rounds.</p>
      <div class="card">
        ${anyScores ? `
        <table class="standings-table">
          <thead>
            <tr><th>Player</th><th class="center">W</th><th class="center">L</th></tr>
          </thead>
          <tbody>
            ${standings.map((s,i)=>`
              <tr>
                <td><span class="rank-badge ${i===0 && s.w>0 ?'top':''}">${i+1}</span>${escapeHTML(s.name)}</td>
                <td class="center record-cell">${s.w}</td>
                <td class="center record-cell">${s.l}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ` : `<div class="empty-note">No scores entered yet. Head to Rounds to record results.</div>`}
      </div>
    </div>
  `;
  document.getElementById('tab-rounds')?.addEventListener('click', ()=>{ state.screen='rounds'; render(); });
  document.getElementById('tab-standings')?.addEventListener('click', ()=>{ state.screen='standings'; render(); });
  document.getElementById('btn-edit-setup')?.addEventListener('click', backToSetup);
}

function backToSetup(){
  if(confirm('Editing setup will clear all current rounds and scores. Continue?')){
    state.screen = 'setup';
    state.rounds = [];
    render();
  }
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function escapeAttr(str){
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
